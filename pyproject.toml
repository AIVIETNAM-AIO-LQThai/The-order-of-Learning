[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aio-m5-visual-world"
version = "0.2.0"
description = "Audited synthetic compositional VQA world for learning-history research"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
train = ["torch>=2.7,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
